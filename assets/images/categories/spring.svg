<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-spring" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="rgba(55, 65, 81, 0.08)" />
    </pattern>
    <radialGradient id="frame-gradient-spring" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(55, 65, 81, 0.06)" />
      <stop offset="100%" stop-color="rgba(55, 65, 81, 0.02)" />
    </radialGradient>
    <ellipse id="frame-shape-spring" cx="600" cy="315" rx="138" ry="126" />
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="#f3f4f6" />
  <rect width="1200" height="630" fill="rgba(99, 102, 241, 0.18)" />
  <rect width="1200" height="630" fill="rgba(55, 65, 81, 0.03)" />

  <!-- Dot pattern overlay -->
  <rect width="1200" height="630" fill="url(#dots-spring)" />

  <!-- Organic ellipse frame -->
  <use href="#frame-shape-spring" fill="url(#frame-gradient-spring)" />
  <use href="#frame-shape-spring" stroke="rgba(55, 65, 81, 0.15)" stroke-width="2" fill="none" />

  <!-- Spring/Sprout icon - centered at 600,315 -->
  <g transform="translate(600,315) scale(5)" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-12,-12)">
      <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/>
      <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/>
      <path d="M5 21h14"/>
    </g>
  </g>

  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#374151">Spring</text>
</svg>
