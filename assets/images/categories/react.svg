<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots-react" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1.2" fill="rgba(55, 65, 81, 0.08)" />
    </pattern>
    <radialGradient id="frame-gradient-react" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(55, 65, 81, 0.06)" />
      <stop offset="100%" stop-color="rgba(55, 65, 81, 0.02)" />
    </radialGradient>
    <circle id="frame-shape-react" cx="600" cy="315" r="126" />
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="#f3f4f6" />
  <rect width="1200" height="630" fill="rgba(99, 102, 241, 0.18)" />
  <rect width="1200" height="630" fill="rgba(55, 65, 81, 0.03)" />

  <!-- Dot pattern overlay -->
  <rect width="1200" height="630" fill="url(#dots-react)" />

  <!-- Orbital frame pulse rings -->
  <ellipse cx="600" cy="315" rx="210" ry="105" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1" fill="none" transform="rotate(-20, 600, 315)" />
  <ellipse cx="600" cy="315" rx="195" ry="96" stroke="rgba(99, 102, 241, 0.10)" stroke-width="1" fill="none" transform="rotate(30, 600, 315)" />
  <ellipse cx="600" cy="315" rx="180" ry="84" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" fill="none" transform="rotate(75, 600, 315)" />

  <!-- Main frame with gradient fill -->
  <use href="#frame-shape-react" fill="url(#frame-gradient-react)" />
  <use href="#frame-shape-react" stroke="rgba(55, 65, 81, 0.15)" stroke-width="2" fill="none" />

  <!-- Atom icon (React) - centered at 600,315 -->
  <g transform="translate(600,315) scale(5)" stroke="#374151" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-12,-12)">
      <circle cx="12" cy="12" r="2" fill="rgba(55, 65, 81, 0.4)"/>
      <path d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z"/>
      <path d="M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z"/>
    </g>
  </g>

  <!-- Category label -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" fill="#374151">React</text>
</svg>
