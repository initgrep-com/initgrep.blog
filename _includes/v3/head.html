<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="msvalidate.01" content="028DD45A8309143DDE8DAFDD41945FE6" />

    <!-- DaisyUI + Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.15.1/css/all.css"
          integrity="sha384-vp86vTRFVJgpjF9jiIGPEEqYqlDwgyBgEF109VFjmqGmIY/Y4HV4d3Gp2irVfcrp"
          crossorigin="anonymous">

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{{site.baseurl}}/assets/images/favicon.svg" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#333333">
    <meta name="msapplication-navbutton-color" content="#333333">
    <meta name="apple-mobile-web-app-status-bar-style" content="#333333">

    <meta name="cf-2fa-verify" content="f2d40cf6e5a17c3">

    <!-- SEO -->
    {% include seo/headseo.html %}

    <!-- Analytics & Ads -->
    {% include analytics/google-analytics.html %}
    {% include analytics/adblock-recover.html %}
    {% include ads/google-ads.html %}

    <!-- Google Custom Search -->
    <script async src="https://cse.google.com/cse.js?cx=000297669988019007071:0ouka41f0ma"></script>

    <!-- Syntax Highlighting -->
    <link type="text/css" rel="stylesheet" href="{{site.baseurl}}/assets/style/code-syntax/syntax.css" media="screen,projection" />

    <!-- Custom Styles -->
    <style>
        /* Hide scrollbars but allow scrolling */
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        /* Smooth transitions for all interactive elements */
        * {
            scroll-behavior: smooth;
        }

        /* Card image overlay gradient */
        .image-full::before {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
        }

        /* Line clamp utilities */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Navigation pill hover effect */
        .pill-nav {
            position: relative;
            overflow: hidden;
        }
        .pill-nav::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .pill-nav:hover::after {
            opacity: 0.05;
        }

        /* Card shine effect on hover */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
            pointer-events: none;
            z-index: 1;
        }
        .card:hover::before {
            left: 100%;
        }
    </style>

    <!-- Theme initialization (prevent flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body class="bg-base-100 text-base-content min-h-screen">
