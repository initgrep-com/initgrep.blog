<!-- Header/Navbar - Two Row Layout -->
<header class="sticky top-0 z-50 bg-base-100 border-b border-base-200">
    <!-- Row 1: Logo and Actions -->
    <div class="flex items-center justify-between px-4 py-3">
        <!-- Logo + Domain Name (Left) -->
        <a href="/" class="text-xl font-bold flex items-center gap-2 text-base-content hover:text-primary transition-colors">
            <i class="fas fa-terminal"></i>
            <span>initgrep</span>
        </a>

        <!-- Search + Theme (Right) -->
        <div class="flex items-center gap-2">
            <!-- Search Button -->
            <button onclick="searchModal.showModal()" class="btn btn-ghost btn-circle btn-sm" aria-label="Search">
                <i class="fas fa-search text-lg"></i>
            </button>

            <!-- Theme Dropdown -->
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle btn-sm" aria-label="Change theme">
                    <i class="fas fa-palette text-lg"></i>
                </div>
                <ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-40 p-2 shadow-lg mt-2">
                    <li><a onclick="setTheme('light')" class="flex items-center gap-2">
                        <i class="fas fa-sun"></i> Light
                    </a></li>
                    <li><a onclick="setTheme('retro')" class="flex items-center gap-2">
                        <i class="fas fa-clock"></i> Retro
                    </a></li>
                    <li><a onclick="setTheme('forest')" class="flex items-center gap-2">
                        <i class="fas fa-tree"></i> Forest
                    </a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Row 2: Category Navigation Pills (Centered) -->
    <div class="flex items-center justify-center px-2 pb-2">
        <!-- Left Scroll Button -->
        <button id="scrollLeftBtn" onclick="scrollNavLeft()"
                class="btn btn-ghost btn-circle btn-sm flex-shrink-0 hidden" aria-label="Scroll left">
            <i class="fas fa-chevron-left"></i>
        </button>

        <!-- Scrollable Pills Container -->
        <div id="navPillsContainer" class="overflow-x-auto scrollbar-none mx-1 max-w-full">
            <div id="navPillsInner" class="flex gap-2 py-1 justify-center">
                {% for cat in site.data.categories %}
                {% assign category = cat[1] %}
                {% unless category.type == 'all' or category.type == 'home' %}
                <a href="{{ site.baseurl }}{{ category.link }}"
                   class="nav-pill flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200
                          {% if page.type == category.type %}bg-primary text-primary-content shadow-md{% else %}bg-base-200 text-base-content hover:bg-base-300 active:bg-primary/20 focus:bg-primary/20{% endif %}">
                    <i class="{{ category.icon }}"></i>
                    <span>{{ category.title }}</span>
                </a>
                {% endunless %}
                {% endfor %}
            </div>
        </div>

        <!-- Right Scroll Button -->
        <button id="scrollRightBtn" onclick="scrollNavRight()"
                class="btn btn-ghost btn-circle btn-sm flex-shrink-0 hidden" aria-label="Scroll right">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</header>

<style>
/* Navigation pill focus/active states - background change instead of color */
.nav-pill:focus {
    outline: none;
    background-color: oklch(var(--p) / 0.2);
}
.nav-pill:active {
    background-color: oklch(var(--p) / 0.3);
    transform: scale(0.98);
}
.nav-pill:focus:not(:focus-visible) {
    background-color: inherit;
}
.nav-pill:focus-visible {
    outline: 2px solid oklch(var(--p));
    outline-offset: 2px;
}
</style>

<script>
(function() {
    const container = document.getElementById('navPillsContainer');
    const leftBtn = document.getElementById('scrollLeftBtn');
    const rightBtn = document.getElementById('scrollRightBtn');

    function updateScrollButtons() {
        if (!container || !leftBtn || !rightBtn) return;

        const canScrollLeft = container.scrollLeft > 5;
        const canScrollRight = container.scrollLeft < (container.scrollWidth - container.clientWidth - 5);
        const needsScroll = container.scrollWidth > container.clientWidth + 10;

        leftBtn.classList.toggle('hidden', !needsScroll || !canScrollLeft);
        rightBtn.classList.toggle('hidden', !needsScroll || !canScrollRight);
    }

    window.scrollNavLeft = function() {
        container.scrollBy({ left: -150, behavior: 'smooth' });
    };

    window.scrollNavRight = function() {
        container.scrollBy({ left: 150, behavior: 'smooth' });
    };

    container.addEventListener('scroll', updateScrollButtons);
    window.addEventListener('resize', updateScrollButtons);
    setTimeout(updateScrollButtons, 100);
})();
</script>
