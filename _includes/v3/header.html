<!-- Header/Navbar -->
<header class="navbar bg-base-100 sticky top-0 z-50 border-b border-base-200">
    <div class="container mx-auto px-4 flex items-center justify-between">
        <!-- Logo (Left) -->
        <div class="flex-shrink-0">
            <a href="/" class="text-xl font-bold flex items-center gap-2 text-base-content hover:text-primary transition-colors">
                <i class="fas fa-terminal"></i>
                <span class="hidden sm:inline">initgrep</span>
            </a>
        </div>

        <!-- Category Navigation Pills (Center) -->
        <div class="flex-1 mx-4 relative">
            <div class="flex items-center">
                <!-- Left Scroll Button -->
                <button onclick="scrollNavLeft()" class="btn btn-ghost btn-circle btn-sm flex-shrink-0 hidden md:flex">
                    <i class="fas fa-chevron-left text-sm"></i>
                </button>

                <!-- Scrollable Pills Container -->
                <div id="navPillsContainer" class="overflow-x-auto scrollbar-none mx-2 flex-1">
                    <div class="flex gap-2 py-2 min-w-max">
                        {% for cat in site.data.categories %}
                        {% assign category = cat[1] %}
                        {% unless category.type == 'all' or category.type == 'home' %}
                        <a href="{{ site.baseurl }}{{ category.link }}"
                           class="pill-nav flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200 hover:scale-105
                                  {% if page.type == category.type %}bg-primary text-primary-content shadow-md{% else %}bg-base-200 text-base-content hover:bg-base-300{% endif %}">
                            <i class="{{ category.icon }}"></i>
                            <span class="hidden lg:inline">{{ category.title }}</span>
                        </a>
                        {% endunless %}
                        {% endfor %}
                    </div>
                </div>

                <!-- Right Scroll Button -->
                <button onclick="scrollNavRight()" class="btn btn-ghost btn-circle btn-sm flex-shrink-0 hidden md:flex">
                    <i class="fas fa-chevron-right text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Right side: Search + Theme -->
        <div class="flex items-center gap-1 flex-shrink-0">
            <!-- Search Button -->
            <button onclick="searchModal.showModal()" class="btn btn-ghost btn-circle btn-sm">
                <i class="fas fa-search"></i>
            </button>

            <!-- Theme Dropdown -->
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle btn-sm">
                    <i class="fas fa-palette"></i>
                </div>
                <ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-40 p-2 shadow-lg mt-2">
                    <li><a onclick="setTheme('light')" class="flex items-center gap-2">
                        <i class="fas fa-sun"></i> Light
                    </a></li>
                    <li><a onclick="setTheme('retro')" class="flex items-center gap-2">
                        <i class="fas fa-clock"></i> Retro
                    </a></li>
                    <li><a onclick="setTheme('forest')" class="flex items-center gap-2">
                        <i class="fas fa-tree"></i> Forest
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<script>
function scrollNavLeft() {
    const container = document.getElementById('navPillsContainer');
    container.scrollBy({ left: -150, behavior: 'smooth' });
}
function scrollNavRight() {
    const container = document.getElementById('navPillsContainer');
    container.scrollBy({ left: 150, behavior: 'smooth' });
}
</script>
