<!-- Header/Navbar -->
<header class="navbar bg-base-100 sticky top-0 z-50 border-b border-base-200">
    <div class="container mx-auto px-4">
        <!-- Logo -->
        <div class="flex-1">
            <a href="/" class="text-xl font-bold flex items-center gap-2 text-base-content hover:text-primary transition-colors">
                <i class="fas fa-terminal"></i>
                <span>initgrep</span>
            </a>
        </div>

        <!-- Right side: Search + Theme -->
        <div class="flex items-center gap-2">
            <!-- Search Button -->
            <button onclick="searchModal.showModal()" class="btn btn-ghost btn-circle">
                <i class="fas fa-search text-lg"></i>
            </button>

            <!-- Theme Dropdown -->
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                    <i class="fas fa-palette text-lg"></i>
                </div>
                <ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-40 p-2 shadow-lg mt-2">
                    <li><a onclick="setTheme('light')" class="flex items-center gap-2">
                        <i class="fas fa-sun"></i> Light
                    </a></li>
                    <li><a onclick="setTheme('retro')" class="flex items-center gap-2">
                        <i class="fas fa-clock"></i> Retro
                    </a></li>
                    <li><a onclick="setTheme('forest')" class="flex items-center gap-2">
                        <i class="fas fa-tree"></i> Forest
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</header>
