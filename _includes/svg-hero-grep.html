{%- comment -%}
SVG Hero - Terminal/Grep Design
Terminal lines + particle convergence: scattered data → filter → highlighted matches
Represents: init (all data) → grep (filtered matches)
Usage: {% include svg-hero-grep.html %}
{%- endcomment -%}

{%- assign svg_id = "hero-grep" -%}

<svg viewBox="0 0 840 360" class="w-full h-full svg-hero-grep" xmlns="http://www.w3.org/2000/svg" aria-label="Hero SVG - Grep" preserveAspectRatio="xMidYMid slice">
  <style>
    .svg-hero-grep .bg-line {
      animation: line-shimmer-{{ svg_id }} 4s ease-in-out infinite;
    }
    .svg-hero-grep .bg-line:nth-child(odd) { animation-delay: -2s; }
    .svg-hero-grep .bg-line:nth-child(3n) { animation-delay: -1s; }
    .svg-hero-grep .bg-line:nth-child(5n) { animation-delay: -3s; }

    @keyframes line-shimmer-{{ svg_id }} {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.15; }
    }

    .svg-hero-grep .particle {
      animation: particle-flow-{{ svg_id }} 6s linear infinite;
    }

    @keyframes particle-flow-{{ svg_id }} {
      0% { transform: translateX(-100px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(940px); opacity: 0; }
    }

    .svg-hero-grep .particle:nth-child(1) { animation-delay: 0s; }
    .svg-hero-grep .particle:nth-child(2) { animation-delay: -0.5s; }
    .svg-hero-grep .particle:nth-child(3) { animation-delay: -1s; }
    .svg-hero-grep .particle:nth-child(4) { animation-delay: -1.5s; }
    .svg-hero-grep .particle:nth-child(5) { animation-delay: -2s; }
    .svg-hero-grep .particle:nth-child(6) { animation-delay: -2.5s; }
    .svg-hero-grep .particle:nth-child(7) { animation-delay: -3s; }
    .svg-hero-grep .particle:nth-child(8) { animation-delay: -3.5s; }
    .svg-hero-grep .particle:nth-child(9) { animation-delay: -4s; }
    .svg-hero-grep .particle:nth-child(10) { animation-delay: -4.5s; }
    .svg-hero-grep .particle:nth-child(11) { animation-delay: -5s; }
    .svg-hero-grep .particle:nth-child(12) { animation-delay: -5.5s; }

    .svg-hero-grep .match-highlight {
      animation: match-glow-{{ svg_id }} 2s ease-in-out infinite;
    }

    @keyframes match-glow-{{ svg_id }} {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }

    .svg-hero-grep .filter-line {
      animation: scanner-pulse-{{ svg_id }} 2s ease-in-out infinite;
    }

    @keyframes scanner-pulse-{{ svg_id }} {
      0%, 100% { opacity: 0.35; stroke-width: 2; }
      50% { opacity: 0.6; stroke-width: 3; }
    }

    .svg-hero-grep .filter-glow {
      animation: filter-glow-{{ svg_id }} 2s ease-in-out infinite;
    }

    @keyframes filter-glow-{{ svg_id }} {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.3; }
    }

    .group:hover .svg-hero-grep .particle {
      animation-duration: 3s;
    }

    .group:hover .svg-hero-grep .filter-line {
      animation-duration: 0.8s;
      stroke: color-mix(in oklch, var(--color-primary) 70%, transparent);
    }

    .group:hover .svg-hero-grep .filter-glow {
      opacity: 0.5;
    }

    .group:hover .svg-hero-grep .match-highlight {
      animation-duration: 0.8s;
      opacity: 0.9;
    }

    .group:hover .svg-hero-grep .bg-line {
      opacity: 0.05;
    }

    .group:hover .svg-hero-grep .particle.match {
      fill: color-mix(in oklch, var(--color-primary) 80%, transparent);
    }

    .svg-hero-grep .filter-line,
    .svg-hero-grep .filter-glow,
    .svg-hero-grep .match-highlight,
    .svg-hero-grep .particle {
      transition: stroke 0.3s ease, fill 0.3s ease, opacity 0.3s ease;
    }
  </style>

    <linearGradient id="filter-gradient-{{ svg_id }}" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="50%" stop-color="var(--color-primary)" stop-opacity="0.3" />
      <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
