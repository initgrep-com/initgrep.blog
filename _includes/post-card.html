<!-- Post Card Component -->
<!-- Usage: {% include post-card.html post=post %} -->

<div class="card bg-base-100 shadow-sm group transition-all duration-200 ease-in-out hover:shadow-md hover:bg-base-200 hover:scale-[1.02]">
    <figure class="aspect-video overflow-hidden">
        {% include svg-mosaic.html category=include.post.category title=include.post.title %}
    </figure>
    <div class="card-body p-4">
        <div class="flex items-center gap-2 text-xs text-base-content/60 mb-2">
            <span class="badge badge-ghost badge-sm gap-1">
                <i data-lucide="{{ site.data.categories[include.post.category].icon }}" class="w-3 h-3"></i>
                {{ include.post.category }}
            </span>
            <span>{% include relative-date.html date=include.post.date %}</span>
        </div>
        <h3 class="card-title text-base line-clamp-2">
            <a href="{{ site.baseurl }}{{ include.post.url }}" class="hover:text-primary transition-colors duration-200">
                {{ include.post.title }}
            </a>
        </h3>
        <p class="text-sm text-base-content/70 line-clamp-2">{{ include.post.meta }}</p>
    </div>
</div>
