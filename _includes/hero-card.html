<!-- Hero Card - Featured/Latest Post -->
{% assign sortedPosts = site.postCollection | sort: 'date' | reverse %}
{% assign featuredPost = sortedPosts | first %}

<div class="px-4 py-4">
    <p class="text-xs uppercase tracking-wider text-primary font-semibold mb-2">Featured</p>

    <a href="{{ site.baseurl }}{{ featuredPost.url }}" class="block group">
        <div class="card bg-base-100 shadow-xl image-full aspect-[16/9] sm:aspect-[21/9] overflow-hidden
                    transition-all duration-500 hover:shadow-2xl hover:scale-[1.01]">
            <figure class="overflow-hidden">
                <img src="{{ site.baseurl }}{{ featuredPost.image }}"
                     alt="{{ featuredPost.title }}"
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
            </figure>
            <div class="card-body justify-end p-6 bg-gradient-to-t from-black/80 via-black/40 to-transparent">
                <div class="flex items-center gap-2 mb-2">
                    <span class="badge badge-primary badge-sm">
                        <i class="{{ site.data.categories[featuredPost.category].icon }} mr-1"></i>
                        {{ featuredPost.category }}
                    </span>
                    <span class="text-xs text-white/70">{{ featuredPost.date | date: '%b %d, %Y' }}</span>
                </div>
                <h2 class="card-title text-white text-xl sm:text-2xl lg:text-3xl group-hover:text-primary-content transition-colors">
                    {{ featuredPost.title }}
                </h2>
                <p class="text-sm text-white/80 line-clamp-2 max-w-2xl">{{ featuredPost.meta }}</p>

                <!-- Read indicator -->
                <div class="flex items-center gap-2 text-primary text-sm font-medium mt-3 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
                    <span>Read Article</span>
                    <i class="fas fa-arrow-right transform group-hover:translate-x-1 transition-transform"></i>
                </div>
            </div>
        </div>
    </a>
</div>
