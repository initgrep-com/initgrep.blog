<!-- Hero Card - Featured/Latest Post -->
{% assign sortedPosts = site.postCollection | sort: 'date' | reverse %}
{% assign featuredPost = sortedPosts | first %}

<div class="px-4 py-4">
    <p class="text-xs uppercase tracking-wider text-primary font-semibold mb-2">Featured</p>

    <a href="{{ site.baseurl }}{{ featuredPost.url }}" class="block group">
        <div class="card bg-base-100 shadow-sm image-full aspect-[16/9] sm:aspect-[21/9] overflow-hidden transition-shadow duration-200 ease-in-out hover:shadow-md">
            <figure class="overflow-hidden">
                <img src="{{ site.baseurl }}{{ featuredPost.image }}"
                     alt="{{ featuredPost.title }}"
                     class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105" />
            </figure>
            <div class="card-body justify-end p-6 bg-gradient-to-t from-black/80 via-black/40 to-transparent">
                <div class="flex items-center gap-2 mb-2">
                    <span class="badge badge-primary badge-sm gap-1">
                        <i data-lucide="{{ site.data.categories[featuredPost.category].icon }}" class="w-3 h-3"></i>
                        {{ featuredPost.category }}
                    </span>
                    <span class="text-xs text-white/70">{% include relative-date.html date=featuredPost.date %}</span>
                </div>
                <h2 class="card-title text-white text-xl sm:text-2xl lg:text-3xl">
                    {{ featuredPost.title }}
                </h2>
                <p class="text-sm text-white/80 line-clamp-2 max-w-2xl">{{ featuredPost.meta }}</p>
            </div>
        </div>
    </a>
</div>
