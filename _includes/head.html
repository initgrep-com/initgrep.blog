<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="msvalidate.01" content="028DD45A8309143DDE8DAFDD41945FE6" />

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- DaisyUI + Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="{{site.baseurl}}/assets/images/favicon.svg" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#333333">
    <meta name="msapplication-navbutton-color" content="#333333">
    <meta name="apple-mobile-web-app-status-bar-style" content="#333333">

    <meta name="cf-2fa-verify" content="f2d40cf6e5a17c3">

    <!-- SEO -->
    {% include seo/headseo.html %}

    <!-- Analytics & Ads -->
    {% include analytics/google-analytics.html %}
    {% include analytics/adblock-recover.html %}
    {% include ads/google-ads.html %}


    <!-- Syntax Highlighting -->
    <link type="text/css" rel="stylesheet" href="{{site.baseurl}}/assets/style/code-syntax/syntax.css" media="screen,projection" />

    <!-- Tailwind theme overrides (fonts) -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>

    <!-- Custom Styles -->
    <style>
        /* Font: also set via --default-font-family for DaisyUI base styles */
        :root {
            --default-font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --default-mono-font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        code, pre, .highlight { font-family: var(--default-mono-font-family); }

        /* Hide scrollbars but allow scrolling */
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-none::-webkit-scrollbar { display: none; }

        /* Smooth scroll behavior */
        html { scroll-behavior: smooth; }

        /* Line clamp utilities */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Extra small breakpoint for logo text */
        @media (min-width: 400px) { .xs\:inline { display: inline !important; } }

        /* ── Article content typography ── */
        .article-content { font-size: 1.125rem; line-height: 1.8; color: color-mix(in oklch, var(--color-base-content) 90%, transparent); }
        .article-content h1, .article-content h2, .article-content h3,
        .article-content h4, .article-content h5, .article-content h6 {
            color: var(--color-base-content); font-weight: 700; line-height: 1.3; margin-top: 2em; margin-bottom: 0.75em;
        }
        .article-content h1 { font-size: 2rem; }
        .article-content h2 { font-size: 1.5rem; border-bottom: 1px solid color-mix(in oklch, var(--color-base-content) 10%, transparent); padding-bottom: 0.5rem; }
        .article-content h3 { font-size: 1.25rem; }
        .article-content h4 { font-size: 1.125rem; }
        .article-content p { margin-bottom: 1.25em; }
        .article-content a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
        .article-content a:hover { text-decoration: underline; }
        .article-content strong { color: var(--color-base-content); font-weight: 600; }
        .article-content em { font-style: italic; }
        .article-content ul, .article-content ol { margin-bottom: 1.25em; padding-left: 1.5em; }
        .article-content ul { list-style-type: disc; }
        .article-content ol { list-style-type: decimal; }
        .article-content li { margin-bottom: 0.5em; }
        .article-content li ul, .article-content li ol { margin-top: 0.5em; margin-bottom: 0; }
        .article-content blockquote {
            border-left: 4px solid var(--color-primary);
            padding: 0.75em 1.25em; margin: 1.5em 0;
            background: var(--color-base-200); border-radius: 0 0.5rem 0.5rem 0;
            color: color-mix(in oklch, var(--color-base-content) 85%, transparent); font-style: italic;
        }
        .article-content blockquote p:last-child { margin-bottom: 0; }
        .article-content img {
            max-width: 100%; height: auto; border-radius: 0.75rem;
            margin: 1.5em 0; box-shadow: 0 1px 3px color-mix(in oklch, var(--color-base-content) 10%, transparent);
        }
        .article-content figure { margin: 1.5em 0; }
        .article-content figcaption { text-align: center; font-size: 0.875rem; color: color-mix(in oklch, var(--color-base-content) 60%, transparent); margin-top: 0.5em; }
        .article-content table { width: 100%; border-collapse: collapse; margin: 1.5em 0; font-size: 0.95rem; }
        .article-content table th { background: var(--color-base-200); font-weight: 600; text-align: left; }
        .article-content table th, .article-content table td { padding: 0.75em 1em; border: 1px solid color-mix(in oklch, var(--color-base-content) 10%, transparent); }
        .article-content table tr:nth-child(even) { background: color-mix(in oklch, var(--color-base-200) 50%, transparent); }
        .article-content hr { border: none; border-top: 1px solid color-mix(in oklch, var(--color-base-content) 10%, transparent); margin: 2em 0; }
        .article-content code:not(pre code) {
            background: var(--color-base-200); color: var(--color-primary);
            padding: 0.15em 0.4em; border-radius: 0.25rem; font-size: 0.85em; font-weight: 500;
        }
        .article-content pre { margin: 1.5em 0; }
        .article-content .highlight { position: relative; }

        /* ── Code block copy button ── */
        .code-copy-btn {
            position: absolute; top: 0.5rem; right: 0.5rem; z-index: 1;
            display: flex; align-items: center; gap: 0.375rem;
            background: color-mix(in oklch, var(--color-base-100) 80%, transparent);
            color: color-mix(in oklch, var(--color-base-content) 50%, transparent);
            border: 1px solid color-mix(in oklch, var(--color-base-content) 10%, transparent);
            border-radius: 0.5rem;
            padding: 0.4rem 0.75rem; font-size: 0.8rem; cursor: pointer;
            transition: all 0.2s;
        }
        .code-copy-btn:hover { background: var(--color-base-100); color: color-mix(in oklch, var(--color-base-content) 80%, transparent); }
        .code-copy-btn.copied { color: var(--color-success); }
        .code-copy-btn svg { width: 16px; height: 16px; }
    </style>

    <!-- Theme initialization (prevent flash) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body class="bg-base-100 text-base-content min-h-screen flex flex-col">
